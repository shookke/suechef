[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/api",
    "crates/users",
    "crates/ingestion",
    "crates/recommendations",
    "crates/scheduler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SueChef Team"]
license = "MIT"

[workspace.dependencies]
# Web Framework & Runtime
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database & Infrastructure
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
neo4rs = "0.7" # Neo4j driver
redis = { version = "0.24", features = ["tokio-comp"] }

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal Crate References
core-crate = { path = "crates/core" }
users-crate = { path = "crates/users" }
ingestion-crate = { path = "crates/ingestion" }
recommendations-crate = { path = "crates/recommendations" }